name: XiZhi Push Preview Once

on:
  push:
    branches:
      - 'jjj-king-patch-1'
    paths:
      - '.github/workflows/xizhi_push_test_once.yml'

permissions:
  contents: read

jobs:
  sign:
    if: ${{ github.event.head_commit.message == 'Run requested XiZhi push preview 20261029-1030-v1' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check XiZhi configuration
        env:
          XZKEY: ${{ secrets.XZKEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("XZKEY", "").strip():
              raise SystemExit("请在当前仓库的Actions Secrets中添加XZKEY（息知推送密钥）。")
          print("息知Secret已配置（不显示密钥内容）。")
          PY

      - name: Run AbleSci Sign
        id: sign
        run: python ablesci.py
        env:
          GITHUB_ACTIONS: true
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          # 本工作流仅通过息知推送；空值也阻止本地.env重新启用其他渠道。
          SCKEY: ''
          XZKEY: ${{ secrets.XZKEY }}
          PUSH_PLUS_TOKEN: ''
