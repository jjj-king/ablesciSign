name: AbleSci Auto Sign

on:
  schedule:
    - cron: '17 * * * *' # 每小时尝试一次；宽容错窗口吸收GitHub延迟，每天仍最多发送一次。
  workflow_dispatch:
    inputs:
      force:
        description: '忽略今日已发送标记，明确额外发送一次'
        type: boolean
        required: false
        default: false

permissions:
  contents: write # 仅用于daily-delivery-state分支的每日发送标记。

concurrency:
  group: ablesci-daily-xizhi
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check actual Beijing delivery window
        id: window
        run: python delivery_schedule.py --start 10:00 --end 18:00 --check-window
      - name: Set up Python
        if: ${{ steps.window.outputs.allowed == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        if: ${{ steps.window.outputs.allowed == 'true' }}
        run: python -m pip install -r requirements.txt
      - name: Run AbleSci once in its delivery window
        if: ${{ steps.window.outputs.allowed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: 'true'
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          XZKEY: ${{ secrets.XZKEY }}
          SCKEY: ''
          PUSH_PLUS_TOKEN: ''
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python delivery_schedule.py --start 10:00 --end 18:00 -- python ablesci.py
