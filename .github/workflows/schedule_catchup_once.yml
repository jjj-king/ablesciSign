name: AbleSci Catch Up Once

on:
  push:
    branches:
      - 'jjj-king-patch-1'
    paths:
      - '.github/workflows/schedule_catchup_once.yml'

permissions:
  contents: write # 仅用于daily-delivery-state分支的每日发送标记。

concurrency:
  group: ablesci-daily-xizhi
  cancel-in-progress: false

jobs:
  sign:
    if: ${{ github.event.head_commit.message == 'Restore daytime notification scheduling 20261030-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check actual Beijing delivery window
        id: window
        run: python delivery_schedule.py --start 10:30 --end 13:30 --check-window
      - name: Set up Python
        if: ${{ steps.window.outputs.allowed == 'true' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install dependencies
        if: ${{ steps.window.outputs.allowed == 'true' }}
        run: python -m pip install -r requirements.txt
      - name: Run AbleSci once in its delivery window
        if: ${{ steps.window.outputs.allowed == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: 'true'
          ABLESCI_ACCOUNTS: ${{ secrets.ABLESCI_ACCOUNTS }}
          XZKEY: ${{ secrets.XZKEY }}
          SCKEY: ''
          PUSH_PLUS_TOKEN: ''
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: python delivery_schedule.py --start 10:30 --end 13:30 -- python ablesci.py
